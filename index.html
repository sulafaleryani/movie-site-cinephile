<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinephile Movie Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #060606; 
            font-family: system-ui, -apple-system, sans-serif; 
            color: #fff;
            overflow: hidden;
        }
        
        /* The beautiful fullscreen cinematic presentation */
        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .fullscreen-backdrop {
            position: absolute;
            inset: 0;
            z-index: 1;
            transition: opacity 0.6s ease-in-out;
        }

        .fullscreen-backdrop img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
        }

        /* Ambient cinematic grading overlays */
        .vignette-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 40%, rgba(6,6,6,0) 0%, rgba(6,6,6,0.4) 40%, rgba(6,6,6,0.92) 90%);
            z-index: 2;
        }

        .gradient-floor {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #060606 0%, rgba(6,6,6,0.85) 25%, rgba(6,6,6,0.4) 50%, transparent 100%);
            z-index: 2;
        }

        /* Floating Hero Typography Content */
        .hero-content {
            position: relative;
            z-index: 3;
            padding: 0 5% 20px;
            max-width: 680px;
            margin-bottom: -10px;
            animation: fadeIn 0.8s ease;
        }

        /* Sleek horizontal scrolling showcase shelf */
        .movie-shelf-wrapper {
            position: relative;
            z-index: 3;
            width: 100%;
            padding: 20px 0 40px;
            background: linear-gradient(to top, #060606, transparent);
        }

        .shelf-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 16px 5%;
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .shelf-title::before {
            content: '';
            width: 3px;
            height: 20px;
            background: #E6B31E;
            display: inline-block;
            border-radius: 2px;
        }

        .movie-shelf {
            display: flex;
            gap: 16px;
            padding: 0 5%;
            overflow-x: auto;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .movie-shelf::-webkit-scrollbar { display: none; }

        .movie-poster-card {
            flex: 0 0 150px;
            aspect-ratio: 2/3;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            transition: all 0.30s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .movie-poster-card:hover {
            transform: scale(1.08) translateY(-10px);
            border-color: rgba(230,179,30,0.5);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .movie-poster-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const BASE = "https://api.themoviedb.org/3";
        const IMG = "https://image.tmdb.org/t/p";

        // Scrambled Base64 Token Container 
        const OBFUSCATED_TOKEN = "ZXlKaGJHY2lPaUpJVXpJMk5YSmkuZXlKaGRXUWlPaUprTVdZeVlXNmlZemhrTlRrMU9X..."; 

        const getCleanToken = () => {
            try { return atob(OBFUSCATED_TOKEN); } catch (e) { return ""; }
        };

        function App() {
            const [movies, setMovies] = useState([]);
            const [activeIndex, setActiveIndex] = useState(0);

            useEffect(() => {
                const token = getCleanToken();
                fetch(`${BASE}/trending/movie/day?language=en-US`, {
                    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.results) setMovies(data.results.slice(0, 15));
                })
                .catch(err => console.error("Error connecting layout streams:", err));
            }, []);

            // Handle clean cyclic index swapping safely
            useEffect(() => {
                if (movies.length === 0) return;
                const interval = setInterval(() => {
                    setActiveIndex((current) => (current + 1) % movies.length);
                }, 7000);
                return () => clearInterval(interval);
            }, [movies]);

            const currentMovie = movies[activeIndex];

            return (
                <div class="app-container">
                    
                    {/* Immersive cinematic background views */}
                    {currentMovie && (
                        <div class="fullscreen-backdrop">
                            <img 
                                src={`${IMG}/original${currentMovie.backdrop_path}`} 
                                alt="" 
                                key={currentMovie.id}
                                style={{ animation: "fadeIn 0.6s ease-in-out" }}
                            />
                            <div class="vignette-overlay"></div>
                            <div class="gradient-floor"></div>
                        </div>
                    )}

                    {/* Floating Screen Title Overlay Header */}
                    <header style={{ position: "absolute", top: 0, left: 0, right: 0, zIndex: 10, padding: "30px 5%", display: "flex", justifyContent: "between", background: "linear-gradient(to bottom, rgba(6,6,6,0.7), transparent)" }}>
                        <h1 style={{ margin: 0, fontSize: 22, fontWeight: 800, color: "#E6B31E", fontFamily: "'Playfair Display', serif", letterSpacing: "0.05em" }}>CINEPHILE</h1>
                    </header>

                    {/* Active Spotlight Metadata Content */}
                    {currentMovie && (
                        <div class="hero-content" key={`meta-${currentMovie.id}`}>
                            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12, color: "#E6B31E", fontSize: 13, fontWeight: 600 }}>
                                <span>★ {currentMovie.vote_average?.toFixed(1)} Rating</span>
                                <span style={{ color: "rgba(255,255,255,0.4)" }}>|</span>
                                <span>{currentMovie.release_date?.slice(0, 4)}</span>
                            </div>
                            <h2 style={{ fontSize: "clamp(32px, 5vw, 56px)", margin: "0 0 16px 0", fontFamily: "'Playfair Display', serif", fontWeight: 800, lineHeight: 1.1, textShadow: "0 2px 24px rgba(0,0,0,0.6)" }}>
                                {currentMovie.title}
                            </h2>
                            <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 15, lineHeight: 1.6, margin: 0, maxWidth: 540, textShadow: "0 1px 8px rgba(0,0,0,0.5)" }}>
                                {currentMovie.overview?.slice(0, 180)}...
                            </p>
                        </div>
                    )}

                    {/* Horizontal Movie Display Tray */}
                    <div class="movie-shelf-wrapper">
                        <h3 class="shelf-title">Featured Spotlights</h3>
                        <div class="movie-shelf">
                            {movies.map((movie, index) => (
                                <div 
                                    key={movie.id} 
                                    class="movie-poster-card"
                                    style={{ 
                                        border: index === activeIndex ? "2px solid #E6B31E" : "1px solid rgba(255,255,255,0.1)",
                                        transform: index === activeIndex ? "translateY(-5px)" : "none"
                                    }}
                                    onClick={() => setActiveIndex(index)}
                                >
                                    <img src={`${IMG}/w342${movie.poster_path}`} alt={movie.title} loading="lazy" />
                                </div>
                            ))}
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
